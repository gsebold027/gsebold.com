server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Hashed static assets — cache forever, they're content-addressed
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # CSP: script-src allows 'unsafe-inline' here only because each HTML file also carries a CSP
    # <meta> (added by scripts/csp-hashes.mjs at build time) listing the hashes of its own inline
    # scripts. Browsers enforce both policies, so only those exact inline scripts can run.

    # Never cache HTML — the prerendered pages (/en, /pt) and the SPA fallback (index.html)
    location ~ \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self' https: ${NGINX_CONNECT_SRC_EXTRA}; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    }

    # /en and /pt serve their prerendered page (no trailing-slash redirect); anything else that
    # isn't a file falls back to the SPA shell, which redirects / and renders the 404 page.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self' https: ${NGINX_CONNECT_SRC_EXTRA}; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
    }
}
